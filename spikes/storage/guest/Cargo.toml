[package]
name = "spike-guest"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# polymorph:webcrypto guest bindings: SigV4 HMAC/SHA-256, x25519 pairwise,
# HKDF, AES-GCM sealing, ed25519 manifest signing — all platform-held.
polymorph-webcrypto-guest = { git = "https://github.com/polymorph-components/polymorph-webcrypto", rev = "b13d25230d34bbb65ba657be906fd59151a201f7" }

# Must match polymorph-webcrypto-guest's wit-bindgen minor (one runtime per
# component; the wasip3 0.57 runtime lives in the fetcher component).
wit-bindgen = { version = "0.59", features = ["async"] }

futures = { version = "0.3", default-features = false, features = ["async-await", "std"] }
serde = { version = "1", features = ["derive"] }
bincode = "1.3"
rand = "0.8.5"
hex = "0.4"
