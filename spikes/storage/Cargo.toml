[workspace]
resolver = "2"
members = ["fetcher", "guest", "host"]

# Spike workspace: quarantined, delete-at-will, wired into no CI.
#
# Two guest components on purpose: `fetcher` isolates the wasip3 crate's
# wit-bindgen 0.57 runtime (mixing runtime versions inside one component
# is unsupported); `guest` carries polymorph-webcrypto-guest's 0.59
# runtime. `wac plug` composes them — the component model doing version
# isolation, and the fetch surface doubling as the scoped network
# capability from the design.
