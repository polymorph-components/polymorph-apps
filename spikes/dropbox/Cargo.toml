[workspace]
resolver = "2"
members = ["fetcher", "guest", "host"]

# Spike workspace: quarantined, delete-at-will, wired into no CI.
#
# Same two-component shape as spikes/storage (the standing pattern for
# wit-bindgen runtime isolation): `fetcher` carries the wasip3 0.57
# runtime, `guest` carries polymorph-webcrypto-guest's 0.59 runtime,
# `wac plug` composes them. The fetch import is the seam where the
# per-destination network grant attaches — for this provider:
# api.dropboxapi.com + content.dropboxapi.com.
