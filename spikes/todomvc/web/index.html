<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TodoMVC — polymorph wasm→DOM spike</title>
  <link rel="stylesheet" href="todomvc-app.css">
  <!-- The visor's shared system-UI chrome (strip, clusters, drawer host):
       visor/ui/visor.css, the same stylesheet the demo spike links
       (#22/#20 — see host/visor.ts, a from-scratch consumer of
       visor/ui/visor.ts as of C3). Linked BEFORE this page's own <style>
       block, matching the demo's cascade order. -->
  <link rel="stylesheet" href="./visor.css">
  <style>
    :root { --content-max: 40rem; }
    .bar-inner { max-width: var(--content-max); margin: 0 auto; width: 100%;
                 box-sizing: border-box; }
    /* todomvc-app.css clamps <body> to a centered 550px column (the
       classic app look). The visor's strip must not be clamped with it:
       position is a trust anchor, and a strip that stops where the app
       column stops reads as part of the app. Full-bleed breakout — the
       zone escapes the body clamp and spans the viewport; its own
       .bar-inner recenters the content. */
    #visor-zone { margin-left: calc(50% - 50vw); margin-right: calc(50% - 50vw); }
    /* This page's own strip action buttons: "consent demo" and "kill",
       mounted into the shared visor's #visor-actions slot
       (visor/ui/visor.ts's Visor.actions). Page-specific because only
       THIS page's drawer tenants exist to open them — the shared
       stylesheet owns the clusters, not a consumer's own buttons. */
    #visor-actions { display: flex; align-items: center; gap: .5em; flex: none; }
    #visor-actions button { font: inherit; font-size: 12px; color: inherit;
                             background: rgba(255,255,255,.12);
                             border: 1px solid rgba(255,255,255,.3);
                             border-radius: 4px; padding: .35em .7em; cursor: pointer; }
    /* The two lightweight sheets this page registers: consent (armed,
       dimmed, foreign-quoted app name) and kill (armed, dimmed,
       Suspend/Cancel). Same `.cred-sheet`-shaped geometry the demo's
       sheets use (the reveal above the strip is the shared, unforgeable
       part); the CONTENT styling below is this page's own, ported
       verbatim from the pre-C3 visor spike (git show HEAD:spikes/
       todomvc/host/visor.ts). */
    .todomvc-sheet { max-width: 480px; margin: 0 auto; padding: 18px 20px 22px;
                      font-size: 15px; line-height: 1.5; flex-shrink: 0; }
    .todomvc-sheet h2 { margin: 10px 0 6px; font-size: 17px; }
    .todomvc-sheet .tm-foreign { font-style: italic; background: #6b5d2f; padding: 0 4px; }
    .todomvc-sheet .tm-note { font-size: 12px; opacity: .65; }
    .todomvc-sheet .tm-row { display: flex; gap: 12px; margin-top: 14px; }
    .todomvc-sheet .tm-row button {
      flex: 1; font: inherit; padding: 10px; border-radius: 8px;
      border: 1px solid rgba(255,255,255,.35); background: transparent;
      color: inherit; cursor: pointer;
      opacity: .35; transition: opacity 200ms;
    }
    .todomvc-sheet.armed .tm-row button { opacity: 1; }
    .todomvc-sheet .tm-row button:first-child { background: #fff; color: #2b2d42; border: none; }
    .visor-killed {
      padding: 40px 20px; text-align: center; color: #666;
      font: 14px/1.6 -apple-system, system-ui, sans-serif;
    }
  </style>
</head>
<body data-page="demo">
  <!-- The shared visor skeleton (visor/ui/visor.ts's fixed ids — see
       spikes/demo/web/index.html, mirrored here verbatim). -->
  <div id="visor-zone">
    <div id="visor-drawer" hidden><div id="visor-drawer-inner"></div></div>
    <div id="visor-strip">
      <div class="bar-inner">
        <span id="visor-context">
          <span class="ctx-top"></span>
          <span class="ctx-bottom"></span>
        </span>
        <!-- This page's own strip controls, mounted by host/visor.ts into
             the shared core's optional actions slot (Visor.actions). -->
        <span id="visor-actions"></span>
        <span id="visor-identity"></span>
      </div>
    </div>
  </div>
  <div id="visor-dim" hidden></div>
  <div id="app">loading…</div>
  <footer class="info">
    <p>Double-click (or double-tap) to edit a todo</p>
    <p>
      App logic is a <strong>wasm component</strong> driving a curated DOM
      surface — no app JS, no app HTML
      (<a href="https://github.com/polymorph-components/polymorph-apps/issues/16">design</a>).
    </p>
    <p>
      Runs on <a href="https://github.com/lann/deltic">deltic</a> —
      <a href="https://github.com/polymorph-components/polymorph-apps/tree/main/spikes/todomvc">source</a>
    </p>
    <p>
      <span id="backend-note"></span><br>
      backends: <a href="?backend=frame">frame</a> ·
      <a href="?backend=direct">direct</a> ·
      <a href="?backend=queued">queued</a> ·
      <a href="?backend=channel">channel</a><br>
      guests: <a href="?guest=hand">hand-written</a> ·
      <a href="?guest=dioxus">dioxus</a> ·
      <a href="?guest=preact">preact</a> —
      <a href="harness.html">equivalence harness</a> ·
      <a href="bench.html">bench</a>
    </p>
  </footer>
  <script type="module" src="app.js"></script>
</body>
</html>
