[package]
name = "todomvc-guest"
version = "0.0.1"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# Pinned to the version deltic validates against (deltic examples/README.md).
wit-bindgen = "=0.60.0"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = "debuginfo"

# Keep this crate out of any enclosing workspace.
[workspace]
