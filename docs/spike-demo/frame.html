<!doctype html>
<!-- The sandboxed UI frame (#16's architecture, #5's zero-network frame).
     One document per app surface: the guest's DOM is applied HERE, in a
     realm the shell cannot be reached from and which cannot reach the
     shell — the iframe is created WITHOUT `allow-same-origin`, so this
     document runs on an opaque origin. Chrome's strip colour, its CSS
     custom properties, its classes and its storage are structurally
     out of reach rather than merely un-allowlisted.

     In the framework proper this skeleton is served from a dedicated
     sandbox origin with real CSP and COOP/COEP response headers (#2/#5),
     including a network policy that gives the frame no fetch/XHR/WS at
     all. A <meta http-equiv="Content-Security-Policy"> is DELIBERATELY
     omitted here: under an opaque origin `'self'` matches nothing
     meaningful, so a meta policy would either be vacuous or would have
     to hardcode the shell's origin — misleading either way. The real
     policy belongs in headers, on the real sandbox origin. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>surface</title>
  <link rel="stylesheet" href="./todomvc-app.css">
  <style>
    /* OPAQUE background, on purpose. If the surface rectangle composited
       with chrome's pixels (transparency, blend modes, backdrop-filter),
       an app could read chrome's personal colour back out by sampling
       what shows through. An opaque backdrop leaves blend-based sampling
       nothing to read. Same reason the frame carries no transparency of
       its own on the shell side (border: none, no mix-blend-mode). */
    html, body { background: #f5f5f5; }
    body { margin: 0;
           font: 14px 'Helvetica Neue', Helvetica, Arial, sans-serif;
           color: #111; }
    /* The applier's container is <body> itself (ROOT_ID). */
    .todoapp { margin: 0; }
    /* TodoMVC's <h1> is absolutely positioned ABOVE its box; in chrome's
       document it overhung the pane, here it would be clipped at the
       frame's top edge. Reserve exactly its height, and only when a
       todoapp is present (panels get no dead space). */
    body:has(.todoapp) { padding-top: 44px; }
    .todoapp h1 { font-size: 40px; top: -40px; }
    .new-todo, .edit { font-size: 18px; }
    .todo-list li { font-size: 18px; }
  
    /* Coarse theme only (see frame.ts): generic surface colours for
       components rendered inside a dark shell. Nothing here encodes
       chrome's identity colour. */
    html[data-theme="dark"] body { background: #0f1424; color: #ddd; }
    html[data-theme="dark"] input { background: #16213e; color: #eee;
                                    border: 1px solid #2a2a44; padding: .25em .4em; }
    html[data-theme="dark"] button { background: #1a1a2e; color: #ddd;
                                     border: 1px solid #3d5a99; padding: .25em .7em; }
    html[data-theme="dark"] label { display: block; margin: .35em 0 .15em; font-size: 12px; }
    html[data-theme="dark"] .status { font-size: 12px; color: #f5c16c; min-height: 1.2em; }
  </style>
</head>
<!-- No inline event handlers anywhere: every listener is attached by the
     applier, from script. -->
<body>
  <script type="module" src="./frame.js"></script>
</body>
</html>
