<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TodoMVC — polymorph wasm→DOM spike</title>
  <link rel="stylesheet" href="todomvc-app.css">
  <style>
    /* Framework chrome (#22): rendered strictly outside the app rectangle.
       Interaction-emergence experiment: the strip slides DOWN to reveal the
       interaction surface above it; controls arm only after the reveal
       (the timer is the enforcement, the animation its visible form). */
    #chrome-zone {
      position: sticky; top: 0; z-index: 10;
      background: #2b2d42; color: #fff;
      font: 14px/1.4 -apple-system, system-ui, sans-serif;
    }
    #chrome-drawer > div {
      /* Pixel-height animation (set from JS at open): fr-interpolation is
         nonlinear and engine-varied, which decoupled the perceived content
         motion from the frame. One animated property drives both. */
      height: 0; overflow: hidden;
      display: flex; flex-direction: column; justify-content: flex-end;
      transition: height 700ms cubic-bezier(.2, .8, .2, 1);
    }
    @media (prefers-reduced-motion: reduce) {
      #chrome-drawer > div { transition: none; }
    }
    #chrome {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 12px;
      padding-top: max(8px, env(safe-area-inset-top));
      border-bottom: 1px solid rgba(255,255,255,.15);
    }
    #chrome .chrome-petname { font-weight: 600; }
    #chrome .chrome-caps { opacity: .7; font-size: 12px; }
    #chrome .chrome-spacer { flex: 1; }
    #chrome button {
      font: inherit; font-size: 12px; color: #fff; background: #4a4e69;
      border: none; border-radius: 4px; padding: 4px 10px; cursor: pointer;
    }
    #chrome-dim {
      position: fixed; inset: 0; z-index: 5;
      background: rgba(0,0,0,.45);
    }
    #chrome-dim[hidden] { display: none; }
    .chrome-sheet {
      max-width: 480px; margin: 0 auto; padding: 18px 20px 22px;
      font-size: 15px; line-height: 1.5;
      flex-shrink: 0;
    }
    .chrome-sheet h2 { margin: 10px 0 6px; font-size: 17px; }
    .chrome-secret {
      font-size: 20px; background: rgba(255,255,255,.12); border-radius: 8px;
      padding: 6px 12px; display: inline-block;
    }
    .chrome-foreign { font-style: italic; background: #6b5d2f; padding: 0 4px; }
    .chrome-note { font-size: 12px; opacity: .65; }
    .chrome-row { display: flex; gap: 12px; margin-top: 14px; }
    .chrome-row button {
      flex: 1; font: inherit; padding: 10px; border-radius: 8px;
      border: 1px solid rgba(255,255,255,.35); background: transparent;
      color: #fff; cursor: pointer;
      opacity: .35; transition: opacity 200ms;
    }
    .chrome-armed .chrome-row button { opacity: 1; }
    .chrome-row button:first-child { background: #fff; color: #2b2d42; border: none; }
    .chrome-killed {
      padding: 40px 20px; text-align: center; color: #666;
      font: 14px/1.6 -apple-system, system-ui, sans-serif;
    }
  </style>
</head>
<body data-page="demo">
  <div id="chrome-zone">
    <div id="chrome-drawer"><div></div></div>
    <header id="chrome"></header>
  </div>
  <div id="chrome-dim" hidden></div>
  <div id="app">loading…</div>
  <footer class="info">
    <p>Double-click (or double-tap) to edit a todo</p>
    <p>
      App logic is a <strong>wasm component</strong> driving a curated DOM
      surface — no app JS, no app HTML
      (<a href="https://github.com/polymorph-components/polymorph-apps/issues/16">design</a>).
    </p>
    <p>
      Runs on <a href="https://github.com/lann/deltic">deltic</a> —
      <a href="https://github.com/polymorph-components/polymorph-apps/tree/main/spikes/todomvc">source</a>
    </p>
    <p>
      <span id="backend-note"></span><br>
      backends: <a href="?backend=direct">direct</a> ·
      <a href="?backend=queued">queued</a> ·
      <a href="?backend=channel">channel</a><br>
      guests: <a href="?guest=hand">hand-written</a> ·
      <a href="?guest=dioxus">dioxus</a> ·
      <a href="?guest=preact">preact</a> —
      <a href="harness.html">equivalence harness</a> ·
      <a href="bench.html">bench</a>
    </p>
  </footer>
  <script type="module" src="app.js"></script>
</body>
</html>
