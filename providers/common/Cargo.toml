[package]
name = "provider-common"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["rlib"]

[dependencies]
# polymorph:webcrypto guest bindings (the digest/MAC primitives the
# storage providers derive names and signatures with).
polymorph-webcrypto-guest = { git = "https://github.com/polymorph-components/polymorph-webcrypto", rev = "b13d25230d34bbb65ba657be906fd59151a201f7" }

# No generate! of our own — this pin keeps a STANDALONE build (clippy
# -p provider-common) resolving polymorph-webcrypto-guest's expansion
# with the same wit-bindgen minor and async features the engine guest
# uses. inter-task-wakeup is load-bearing: subduction's tasks sleep on
# Rust-side channels.
wit-bindgen = { version = "0.59", features = ["async", "async-spawn", "inter-task-wakeup"] }
