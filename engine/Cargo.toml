[workspace]
resolver = "2"
members = ["guest", "host", "fetcher"]

# Spike workspace: quarantined, delete-at-will, wired into no CI.
# Pins (rust-toolchain.toml, git revs in the member manifests) are exact:
# upstream protocol changes are migrations, not bumps.

# subduction_keyhive depends on keyhive via crates.io (0.5.0/0.2.1); the
# spikes pin keyhive git main. Unify on the git rev so one keyhive exists
# in the graph. (Upstream version-skew finding: the bridge is built against
# the released keyhive, which predates the BeeKEM ratcheting change.)
[patch.crates-io]
keyhive_core = { git = "https://github.com/inkandswitch/keyhive", rev = "efe6ccf3ad67904b2f3b77385b1c754f9cd0f9d9" }
keyhive_crypto = { git = "https://github.com/inkandswitch/keyhive", rev = "efe6ccf3ad67904b2f3b77385b1c754f9cd0f9d9" }
beekem = { git = "https://github.com/inkandswitch/keyhive", rev = "efe6ccf3ad67904b2f3b77385b1c754f9cd0f9d9" }
