[package]
name = "engine-fetcher"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# The async wasi:http@0.3 client plus the http-compat bridge.
wasip3 = { version = "0.7.1", features = ["async-spawn", "http-compat"] }
# Pinned to the wit-bindgen version the wasip3 crate uses: this component
# shares runtime types with wasip3, and mixing two runtime versions in one
# component is unsupported. Upgrade together with the wasip3 dependency.
wit-bindgen = { version = "0.57", features = ["async", "async-spawn"] }
http = "1"
http-body-util = "0.1"
bytes = "1"
